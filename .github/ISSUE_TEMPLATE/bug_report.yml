name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: v0.3.1
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.3"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Local (default)
        - Cloud preferred
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Settings → Devices & services → urbanhive homefarm → three dots → Download
        diagnostics, then drag the file here. Email, tokens, IP and MAC address are
        removed automatically.
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Lines from the Home Assistant log that mention urbanhive.
      render: text
