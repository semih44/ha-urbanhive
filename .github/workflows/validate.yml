name: Validate

on:
  push:
  pull_request:
  schedule:
    # Daily run, so a new Home Assistant or HACS release that breaks validation shows up.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest (Home Assistant)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-26.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    name: Ruff (lint and format)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.14.0"
      - run: ruff format --check .
