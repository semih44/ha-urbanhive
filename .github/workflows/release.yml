name: Release

# Push a tag like v0.3.2 to publish a release. The tag must match the version in
# manifest.json and CHANGELOG.md needs a "## v0.3.2" section with the notes. HACS installs the attached urbanhive.zip (see hacs.json).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag against manifest version
        run: |
          version=$(jq -r .version custom_components/urbanhive/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Build zip
        # The zip holds the integration files at its root; HACS extracts it into
        # custom_components/urbanhive.
        run: git archive --format=zip --output=urbanhive.zip "HEAD:custom_components/urbanhive"

      - name: Release notes from CHANGELOG.md
        # The section "## vX.Y.Z" up to the next version heading.
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '$0 == tag {found=1; next} /^## v/ && found {exit} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" urbanhive.zip --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
